<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#d5e0f8",
                        "tertiary-fixed": "#d3e5f1",
                        "on-error": "#ffffff",
                        "secondary": "#545f73",
                        "error-container": "#ffdad6",
                        "primary": "#3525cd",
                        "surface-variant": "#d3e4fe",
                        "primary-container": "#4f46e5",
                        "outline-variant": "#c7c4d8",
                        "on-background": "#0b1c30",
                        "primary-fixed-dim": "#c3c0ff",
                        "secondary-fixed": "#d8e3fb",
                        "inverse-surface": "#213145",
                        "outline": "#777587",
                        "on-surface": "#0b1c30",
                        "surface-container-high": "#dce9ff",
                        "background": "#f8f9ff",
                        "on-secondary-fixed": "#111c2d",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-bright": "#f8f9ff",
                        "on-primary-fixed": "#0f0069",
                        "primary-fixed": "#e2dfff",
                        "on-tertiary-fixed-variant": "#384953",
                        "on-secondary-fixed-variant": "#3c475a",
                        "tertiary-fixed-dim": "#b7c9d5",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary-container": "#ccdee9",
                        "surface": "#f8f9ff",
                        "surface-tint": "#4d44e3",
                        "surface-container": "#e5eeff",
                        "tertiary": "#3a4a54",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#bcc7de",
                        "on-secondary-container": "#586377",
                        "on-tertiary-fixed": "#0c1e26",
                        "on-surface-variant": "#464555",
                        "surface-dim": "#cbdbf5",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#51626c",
                        "on-primary-container": "#dad7ff",
                        "inverse-primary": "#c3c0ff",
                        "surface-container-highest": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 32px 64px rgba(11, 28, 48, 0.05);
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed-variant">

    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl shadow-[0_32px_64px_rgba(11,28,48,0.05)]">
        <nav class="flex justify-between items-center w-full px-8 py-4 max-w-full mx-auto">
            <div class="text-2xl font-extrabold tracking-tighter text-indigo-700 dark:text-indigo-300 font-headline">
                BoothBuzz
            </div>
            
            <div class="hidden md:flex items-center space-x-8">
                <a href="#" class="text-slate-600 dark:text-slate-400 font-medium hover:text-indigo-500 transition-colors duration-300">Explore</a>
                <a href="#" class="text-slate-600 dark:text-slate-400 font-medium hover:text-indigo-500 transition-colors duration-300">Exhibitors</a>
                <a href="#" class="text-indigo-700 dark:text-indigo-300 font-bold border-b-2 border-indigo-600 hover:text-indigo-500 transition-colors duration-300">Past Events</a>
                <a href="#" class="text-slate-600 dark:text-slate-400 font-medium hover:text-indigo-500 transition-colors duration-300">Dashboard</a>
            </div>

            <div class="flex items-center gap-6">
                <div class="hidden lg:flex items-center bg-surface-container-low px-4 py-2 rounded-full">
                    <span class="material-symbols-outlined text-outline mr-2">search</span>
                    <input type="text" placeholder="Search events..." class="bg-transparent border-none focus:ring-0 text-sm w-48">
                </div>
                <button class="bg-primary-container text-on-primary-container px-6 py-2.5 rounded-xl font-semibold scale-95 active:scale-90 transition-transform editorial-shadow">
                    Register Now
                </button>
            </div>
        </nav>
    </header>

    <main class="pt-32 pb-24">
        <!-- Hero Section: Editorial Impact -->
        <section class="px-8 max-w-7xl mx-auto mb-32">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div class="lg:col-span-7">
                    <h1 class="text-6xl md:text-7xl font-headline font-extrabold tracking-tight leading-[1.1] text-on-surface mb-8">
                        The Legacy of <span class="text-primary italic">Momentum.</span>
                    </h1>
                    <p class="text-xl text-on-surface-variant leading-relaxed max-w-xl">
                        A retrospective of our most influential showcases. From high-tech expos to artisan galleries, explore the events that redefined engagement.
                    </p>
                </div>
                <div class="lg:col-span-5 relative">
                    <div class="aspect-[4/5] rounded-[2rem] overflow-hidden editorial-shadow transform rotate-3">
                        <img src="https://images.unsplash.com/photo-1540575861501-7cf05a4b125a?q=80&w=1000" 
                             data-alt="High-angle shot of a crowded professional tech conference with vibrant purple and blue stage lighting and large digital screens" 
                             class="w-full h-full object-cover">
                    </div>
                    <div class="absolute -bottom-8 -left-8 bg-surface-container-lowest p-8 rounded-2xl editorial-shadow max-w-[200px]">
                        <span class="text-4xl font-headline font-extrabold text-primary">450+</span>
                        <p class="text-sm font-semibold text-secondary uppercase tracking-widest mt-2">Global Events</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats Ticker / Social Proof -->
        <section class="bg-surface-container-low py-16 mb-32 overflow-hidden">
            <div class="px-8 max-w-7xl mx-auto">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
                    <div class="text-center">
                        <p class="text-sm font-bold text-outline-variant uppercase tracking-widest mb-2">Total Attendees</p>
                        <p class="text-4xl font-headline font-extrabold">2.4M</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-bold text-outline-variant uppercase tracking-widest mb-2">Exhibitors Joined</p>
                        <p class="text-4xl font-headline font-extrabold">12k</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-bold text-outline-variant uppercase tracking-widest mb-2">Success Rate</p>
                        <p class="text-4xl font-headline font-extrabold">98%</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-bold text-outline-variant uppercase tracking-widest mb-2">Cities Hosted</p>
                        <p class="text-4xl font-headline font-extrabold">84</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Gallery Bento Grid -->
        <section class="px-8 max-w-7xl mx-auto mb-32">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                <div>
                    <h2 class="text-4xl font-headline font-bold mb-4">Event Archives</h2>
                    <p class="text-on-surface-variant">Filter by industry or scale to see past performance.</p>
                </div>
                <div class="flex gap-2">
                    <span class="px-4 py-2 bg-primary text-on-primary rounded-full text-sm font-medium cursor-pointer">All Events</span>
                    <span class="px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full text-sm font-medium hover:bg-surface-container transition-colors cursor-pointer">Technology</span>
                    <span class="px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full text-sm font-medium hover:bg-surface-container transition-colors cursor-pointer">Lifestyle</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                <!-- Large Spotlight Card -->
                <div class="md:col-span-8 group relative overflow-hidden rounded-[2.5rem] bg-surface-container editorial-shadow">
                    <img src="https://images.unsplash.com/photo-1505373877841-8d25f7d46678?q=80&w=1000" 
                         data-alt="Cinematic wide shot of a modern convention center with blue ambient lighting and interactive floor projections" 
                         class="w-full h-[500px] object-cover transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-on-surface/90 via-transparent to-transparent"></div>
                    <div class="absolute bottom-0 left-0 p-12 w-full">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="px-3 py-1 bg-primary text-on-primary text-xs font-bold rounded-lg flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span> Successful Event
                            </span>
                            <span class="px-3 py-1 bg-white/20 backdrop-blur-md text-white text-xs font-bold rounded-lg flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">groups</span> 50k+ Footfall
                            </span>
                        </div>
                        <h3 class="text-4xl font-headline font-extrabold text-white mb-2">Global Tech Summit 2023</h3>
                        <p class="text-white/70 max-w-lg mb-6">Berlin, DE • Our largest tech convergence to date featuring 200+ breakout sessions.</p>
                        <div class="flex items-center gap-8">
                            <div>
                                <span class="block text-white font-bold text-xl">180</span>
                                <span class="text-white/50 text-xs uppercase font-bold tracking-widest">Exhibitors</span>
                            </div>
                            <div>
                                <span class="block text-white font-bold text-xl">$12M+</span>
                                <span class="text-white/50 text-xs uppercase font-bold tracking-widest">Business Value</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Secondary Cards -->
                <div class="md:col-span-4 flex flex-col gap-8">
                    <div class="bg-surface-container-lowest rounded-[2rem] p-8 editorial-shadow h-full flex flex-col justify-between">
                        <div>
                            <div class="w-12 h-12 bg-primary-fixed rounded-xl flex items-center justify-center mb-6">
                                <span class="material-symbols-outlined text-primary">trending_up</span>
                            </div>
                            <h4 class="text-2xl font-headline font-bold mb-3">Impact Analytics</h4>
                            <p class="text-on-surface-variant text-sm leading-relaxed mb-6">
                                Detailed post-event reports showing real-time engagement and booth heatmaps.
                            </p>
                        </div>
                        <button class="flex items-center gap-2 text-primary font-bold hover:gap-4 transition-all group">
                            Download Case Studies <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </div>
                    <div class="rounded-[2rem] overflow-hidden editorial-shadow h-full relative group">
                        <img src="https://images.unsplash.com/photo-1531050171669-014404642232?q=80&w=600" 
                             data-alt="Interior of an art gallery with sleek white walls and minimalist wooden furniture during an opening night" 
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-white font-bold px-6 py-3 border border-white/40 rounded-full backdrop-blur-md">View Gallery</span>
                        </div>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="md:col-span-4 group relative overflow-hidden rounded-[2.5rem] bg-surface-container-low editorial-shadow">
                    <img src="https://images.unsplash.com/photo-1475721027785-f74dea999959?q=80&w=600" 
                         data-alt="Close-up of a high-quality booth design with natural wood elements and soft warm spotlighting" 
                         class="w-full h-64 object-cover">
                    <div class="p-8">
                        <span class="px-2 py-1 bg-secondary-fixed text-on-secondary-fixed text-[10px] font-bold rounded uppercase mb-4 inline-block">Craft & Design</span>
                        <h4 class="text-xl font-headline font-bold mb-2">The Artisan Collective</h4>
                        <p class="text-sm text-on-surface-variant mb-4">London, UK • 85% exhibitor re-booking rate.</p>
                        <div class="flex items-center text-xs font-bold text-primary gap-1">
                             <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span> High Footfall
                        </div>
                    </div>
                </div>

                <div class="md:col-span-4 group relative overflow-hidden rounded-[2.5rem] bg-surface-container-low editorial-shadow">
                    <img src="https://images.unsplash.com/photo-1511578314322-379afb476865?q=80&w=600" 
                         data-alt="Modern office lobby with glass walls and professional signage for a corporate gathering" 
                         class="w-full h-64 object-cover">
                    <div class="p-8">
                        <span class="px-2 py-1 bg-secondary-fixed text-on-secondary-fixed text-[10px] font-bold rounded uppercase mb-4 inline-block">Corporate</span>
                        <h4 class="text-xl font-headline font-bold mb-2">Venture Forum '24</h4>
                        <p class="text-sm text-on-surface-variant mb-4">New York, US • $4M in Series A funding closed.</p>
                        <div class="flex items-center text-xs font-bold text-primary gap-1">
                             <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span> Successful Event
                        </div>
                    </div>
                </div>

                <div class="md:col-span-4 group relative overflow-hidden rounded-[2.5rem] bg-surface-container-low editorial-shadow">
                    <img src="https://images.unsplash.com/photo-1523580494863-6f3031224c94?q=80&w=600" 
                         data-alt="Outdoor festival scene with colorful tents and people walking through a sunny field" 
                         class="w-full h-64 object-cover">
                    <div class="p-8">
                        <span class="px-2 py-1 bg-secondary-fixed text-on-secondary-fixed text-[10px] font-bold rounded uppercase mb-4 inline-block">Lifestyle</span>
                        <h4 class="text-xl font-headline font-bold mb-2">Summer Expo Series</h4>
                        <p class="text-sm text-on-surface-variant mb-4">Sydney, AU • 120k total visitors across 3 days.</p>
                        <div class="flex items-center text-xs font-bold text-primary gap-1">
                             <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">groups</span> Record Attendance
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Exhibitor Spotlight: Custom Asymmetric Component -->
        <section class="mb-32">
            <div class="bg-surface-container-high py-24 px-8">
                <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 items-center gap-16">
                    <div class="lg:col-span-5 z-10">
                        <h2 class="text-5xl font-headline font-extrabold tracking-tight leading-tight -mr-20 text-on-surface">
                            How we helped <span class="text-primary italic">Lumina Tech</span> scale by 400% in one weekend.
                        </h2>
                        <div class="mt-8 space-y-4">
                            <p class="text-lg text-on-surface-variant">"The traffic was beyond our projections. The BoothBuzz layout optimized our conversion funnel from the moment they walked in."</p>
                            <p class="font-bold text-on-surface">— Sarah Jenkins, CMO Lumina Tech</p>
                        </div>
                        <button class="mt-10 px-8 py-4 bg-white text-primary font-bold rounded-xl shadow-lg hover:shadow-xl transition-shadow">Read the Success Story</button>
                    </div>
                    <div class="lg:col-span-7">
                        <div class="rounded-[2.5rem] overflow-hidden editorial-shadow h-[600px]">
                            <img src="https://images.unsplash.com/photo-1551818255-e6e10975bc17?q=80&w=1000" 
                                 data-alt="Candid shot of a diverse team of professionals discussing strategy around a bright backlit digital display board" 
                                 class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Call to Action -->
        <section class="px-8 max-w-5xl mx-auto">
            <div class="bg-primary rounded-[3rem] p-16 text-center text-on-primary editorial-shadow relative overflow-hidden">
                <!-- Background decorative shapes -->
                <div class="absolute top-0 right-0 w-64 h-64 bg-primary-container/20 rounded-full -mr-32 -mt-32"></div>
                <div class="absolute bottom-0 left-0 w-48 h-48 bg-primary-container/10 rounded-full -ml-24 -mb-24"></div>
                
                <h2 class="text-4xl md:text-5xl font-headline font-bold mb-6">Be part of the next chapter.</h2>
                <p class="text-on-primary-container text-xl max-w-2xl mx-auto mb-10">
                    Our 2025 calendar is filling up. Secure your position in the next high-traffic exhibition before spaces vanish.
                </p>
                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <button class="px-8 py-4 bg-white text-primary font-bold rounded-xl shadow-lg hover:scale-105 active:scale-95 transition-all">Download 2025 Prospectus</button>
                    <button class="px-8 py-4 bg-primary-container border border-on-primary-container/30 text-on-primary-container font-bold rounded-xl hover:bg-primary-container/80 transition-all">Talk to an Event Expert</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-50 dark:bg-slate-950 border-t border-slate-200/15">
        <div class="flex flex-col md:flex-row justify-between items-center px-12 py-16 w-full max-w-7xl mx-auto">
            <div class="mb-8 md:mb-0">
                <div class="text-xl font-bold text-slate-900 dark:text-white mb-2">BoothBuzz</div>
                <p class="text-slate-500 dark:text-slate-400 max-w-xs font-body text-sm">Elevating exhibition culture through data-driven event architecture.</p>
            </div>
            
            <div class="flex flex-wrap justify-center gap-8 md:gap-12">
                <a href="#" class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 transition-all text-lg font-['Inter']">Privacy Policy</a>
                <a href="#" class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 transition-all text-lg font-['Inter']">Terms of Service</a>
                <a href="#" class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 transition-all text-lg font-['Inter']">Exhibitor FAQ</a>
                <a href="#" class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 transition-all text-lg font-['Inter']">Contact Support</a>
            </div>
        </div>
        <div class="px-12 pb-8 text-center md:text-left w-full max-w-7xl mx-auto">
            <p class="text-slate-400 dark:text-slate-600 text-sm font-['Inter']">© 2024 BoothBuzz Editorial Events. All rights reserved.</p>
        </div>
    </footer>

</body>
</html></style></head><body></body></html>
